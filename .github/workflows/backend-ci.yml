name: Backend CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    working-directory: backend

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # ruff never resolves imports, so the runtime dependencies are not needed
      # for this job. Installing only ruff keeps it fast.
      - name: Install ruff
        run: pip install ruff

      - name: Check lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # Installed explicitly rather than from a lockfile: the suite only needs
      # the app plus the TestClient transport.
      - name: Install dependencies
        run: pip install fastapi uvicorn pytest httpx

      - name: Run tests
        run: pytest -q --junitxml=reports/pytest.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-report-${{ github.run_id }}
          path: backend/reports
          if-no-files-found: ignore