[project]
name = "asksight-model"
version = "0.1.0"
description = "AskSight LLaVA-style multimodal Q&A: frozen CLIP encoder + trainable projection connector + frozen Qwen2.5 LM"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.4",
  "transformers>=4.45",
  "pillow>=10.0",
  "pyyaml>=6.0",
  "safetensors>=0.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["asksight_model"]

[tool.ruff]
line-length = 100
target-version = "py312"
# notebooks/ runs in Colab; shell magics (`!pip`, `!nvidia-smi`) are not lintable Python
extend-exclude = [".venv", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
