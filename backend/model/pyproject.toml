[project]
name = "asksight-model"
version = "0.2.0"
description = "AskSight unified assistive Vision-Language Model based on Qwen3-VL-4B-Instruct"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.4",
  "transformers>=5.0",
  "pillow>=10.0",
  "pyyaml>=6.0",
  "safetensors>=0.4",
  "peft>=0.13",
  "bitsandbytes>=0.43.0",
  "opencv-python-headless>=4.8.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["asksight_model"]

[tool.ruff]
line-length = 100
target-version = "py312"
# notebooks/ runs in Colab; shell magics (`!pip`, `!nvidia-smi`) are not lintable Python
extend-exclude = [".venv", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
